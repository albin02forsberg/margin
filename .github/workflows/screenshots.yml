name: Screenshots

# Regenerates the README screenshots (docs/screenshots/*.png, quantized to 256 colours) and
# GIFs (docs/gifs/*.gif), checks their size cap and uploads them as an artifact; commit the
# ones you want to keep (replace the files, so the repo doesn't grow with each run).
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxss-dev patchelf webkit2gtk-driver xvfb fonts-inter fonts-jetbrains-mono imagemagick ffmpeg
      - run: cargo install tauri-driver --locked
      - run: npm ci
      # Taller than the 1280x800 shots: the time shot uses 1280x900.
      - run: xvfb-run -a -s "-screen 0 1280x1024x24" npm run screenshots
      - name: Shrink
        run: mogrify -dither None -colors 256 -strip docs/screenshots/*.png
      - name: Size cap
        run: node scripts/media-size.ts
      - uses: actions/upload-artifact@v4
        if: always() # what did get recorded helps when a clip fails
        with:
          name: screenshots
          path: |
            docs/screenshots/*.png
            docs/gifs/*.gif
