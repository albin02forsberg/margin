name: CI

on:
  push:
    branches: [main]
  pull_request:

# Docs/agent-prompt-only PRs skip the heavy steps (`if: steps.gate.outputs.run == 'true'`);
# the jobs still run and pass, so the required `test` and `e2e` checks stay green.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Docs-only change?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(gh pr diff ${{ github.event.pull_request.number }} -R ${{ github.repository }} --name-only) # errors abort the step: never skip CI on a failed lookup
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(\.claude/|docs/|README\.md$|CLAUDE\.md$)'; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: steps.gate.outputs.run == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: steps.gate.outputs.run == 'true'
        name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxss-dev patchelf
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        run: npm run check
      - if: steps.gate.outputs.run == 'true'
        run: npm test
      # With the built-in AI (llama.cpp, #132) so it keeps compiling; e2e covers the build without it.
      - if: steps.gate.outputs.run == 'true'
        run: cargo test --features embedded-ai
        working-directory: src-tauri
      # Report-only (#317): warning count goes to the job summary; not a gate yet.
      - if: steps.gate.outputs.run == 'true'
        name: Clippy (report only)
        continue-on-error: true
        run: |
          cargo clippy --color never --all-targets --features embedded-ai 2>&1 | tee clippy.txt
          n=$(grep -c '^warning: ' clippy.txt || true)
          m=$(grep -c '^error' clippy.txt || true)
          echo "clippy: $n warning line(s), $m error line(s) (includes per-crate summary lines)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; grep -E '^(warning|error)' clippy.txt | sort | uniq -c | sort -rn | head -40 >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
        working-directory: src-tauri

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Docs-only change?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(gh pr diff ${{ github.event.pull_request.number }} -R ${{ github.repository }} --name-only) # errors abort the step: never skip CI on a failed lookup
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(\.claude/|docs/|README\.md$|CLAUDE\.md$)'; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.gate.outputs.run == 'true'
        uses: swatinem/rust-cache@v2 # also caches ~/.cargo/bin, so tauri-driver installs once
        with:
          workspaces: src-tauri
      - if: steps.gate.outputs.run == 'true'
        name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxss-dev patchelf webkit2gtk-driver xvfb
      - if: steps.gate.outputs.run == 'true'
        run: cargo install tauri-driver --locked
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      # Two steps so the log shows whether the build or the tests dominate.
      - if: steps.gate.outputs.run == 'true'
        name: Build debug app
        run: npm run e2e:build
      - if: steps.gate.outputs.run == 'true'
        name: Run e2e tests
        run: xvfb-run -a npm run e2e:run

  # Coverage report (#252): per-file tables in the job summary, lcov files as an artifact,
  # and a ratchet that fails on a drop below coverage-baseline.json (not a required check).
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Docs-only change?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(gh pr diff ${{ github.event.pull_request.number }} -R ${{ github.repository }} --name-only) # errors abort the step: never skip CI on a failed lookup
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(\.claude/|docs/|README\.md$|CLAUDE\.md$)'; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - if: steps.gate.outputs.run == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov
      - if: steps.gate.outputs.run == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: coverage # instrumented artifacts differ from the test job's
      - if: steps.gate.outputs.run == 'true'
        name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxss-dev patchelf
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        name: TypeScript coverage
        run: |
          set -o pipefail
          npm run coverage | tee ts.txt # also writes lcov-ts.info
          {
            echo '## TypeScript coverage (`src/lib`, unit tests)'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' ts.txt | sed 's/^ℹ //'
            echo '```'
            # node only reports files a test imports; list the rest so they don't look covered.
            missing=$(for f in src/lib/*.ts; do case $f in *.test.ts) ;; *) grep -qx "SF:$f" lcov-ts.info || echo "$f";; esac; done)
            if [ -n "$missing" ]; then printf 'Not imported by any unit test (0%%): %s\n\n' "$(echo $missing)"; fi
            echo 'Svelte components (`src/routes`, `src/lib/*.svelte`) are covered by e2e only.'
          } >> "$GITHUB_STEP_SUMMARY"
      # Default features only (the test job builds embedded-ai) to keep the instrumented build short.
      - if: steps.gate.outputs.run == 'true'
        name: Rust coverage
        working-directory: src-tauri
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov report --lcov --output-path ../lcov-rust.info
          cargo llvm-cov report | tee ../rust.txt
          { echo '## Rust coverage (`cargo test`)'; echo '```'; cat ../rust.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov-*.info
      # Last, so the artifact is uploaded even when coverage dropped.
      - if: steps.gate.outputs.run == 'true'
        name: Coverage ratchet
        run: |
          set -o pipefail
          { echo '## Coverage ratchet (`coverage-baseline.json`)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          npm run --silent coverage:ratchet | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit ${failed:-0}
