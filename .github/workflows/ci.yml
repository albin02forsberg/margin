name: CI

on:
  push:
    branches: [main]
  pull_request:

# Docs/agent-prompt-only PRs skip the heavy steps (`if: steps.gate.outputs.run == 'true'`);
# the jobs still run and pass, so the required `test` and `e2e` checks stay green.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Docs-only change?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq '.[].filename') # errors abort the step: never skip CI on a failed lookup
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(\.claude/|docs/|README\.md$|CLAUDE\.md$)'; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: steps.gate.outputs.run == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: steps.gate.outputs.run == 'true'
        name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxss-dev patchelf
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        run: npm run check
      - if: steps.gate.outputs.run == 'true'
        run: npm test
      # With the built-in AI (llama.cpp, #132) so it keeps compiling; e2e covers the build without it.
      - if: steps.gate.outputs.run == 'true'
        run: cargo test --features embedded-ai
        working-directory: src-tauri
      # Enforcing (#317): any clippy warning fails the job.
      - if: steps.gate.outputs.run == 'true'
        name: Clippy
        run: cargo clippy --color never --all-targets --features embedded-ai -- -D warnings
        working-directory: src-tauri

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Docs-only change?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq '.[].filename') # errors abort the step: never skip CI on a failed lookup
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(\.claude/|docs/|README\.md$|CLAUDE\.md$)'; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.gate.outputs.run == 'true'
        uses: swatinem/rust-cache@v2 # also caches ~/.cargo/bin, so tauri-driver installs once
        with:
          workspaces: src-tauri
      - if: steps.gate.outputs.run == 'true'
        name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxss-dev patchelf webkit2gtk-driver xvfb
      - if: steps.gate.outputs.run == 'true'
        run: cargo install tauri-driver --locked
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      # Two steps so the log shows whether the build or the tests dominate.
      - if: steps.gate.outputs.run == 'true'
        name: Build debug app
        run: npm run e2e:build
      - if: steps.gate.outputs.run == 'true'
        name: Run e2e tests
        run: xvfb-run -a npm run e2e:run

  # The Arch package (#127, built by release.yml), from the latest release's .deb, on PRs that touch it.
  arch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: gate
        run: |
          gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq '.[].filename' | grep -qE '^(packaging/arch/|\.github/workflows/release\.yml$)' && echo run=true >> "$GITHUB_OUTPUT" || true
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
      - if: steps.gate.outputs.run == 'true'
        run: |
          tag=$(gh release view --json tagName -q .tagName)
          gh release download "$tag" -p '*_amd64.deb' -D out
          docker run --rm -v "$PWD:/w" -w /w archlinux:latest packaging/arch/build.sh "${tag#v}" out

  # macOS-only Rust (`cfg(target_os = "macos")`, #418) otherwise first compiles in the nightly.
  # Clippy only (no link, default features; embedded-ai.yml builds that), on PRs touching src-tauri.
  # Warnings fail the job, as in the Linux clippy step (#443).
  macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq '.[].filename' | grep -qE '^(src-tauri/|\.github/workflows/ci\.yml$)' && echo run=true >> "$GITHUB_OUTPUT" || true
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
      - if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: steps.gate.outputs.run == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # `tauri::generate_context!` needs the frontend dir to exist.
      - if: steps.gate.outputs.run == 'true'
        run: mkdir -p build && touch build/index.html
      - if: steps.gate.outputs.run == 'true'
        name: Clippy (macOS)
        run: cargo clippy --color never --all-targets -- -D warnings
        working-directory: src-tauri

  # Coverage report (#252): per-file tables in the job summary, lcov files as an artifact,
  # and a ratchet that fails on a drop below coverage-baseline.json (not a required check).
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Docs-only change?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq '.[].filename') # errors abort the step: never skip CI on a failed lookup
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(\.claude/|docs/|README\.md$|CLAUDE\.md$)'; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - if: steps.gate.outputs.run == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov
      - if: steps.gate.outputs.run == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: coverage # instrumented artifacts differ from the test job's
      - if: steps.gate.outputs.run == 'true'
        name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxss-dev patchelf
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        name: TypeScript coverage
        run: |
          set -o pipefail
          npm run coverage | tee ts.txt # also writes lcov-ts.info
          {
            echo '## TypeScript coverage (`src/lib`, unit tests)'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' ts.txt | sed 's/^ℹ //'
            echo '```'
            # node only reports files a test imports; list the rest so they don't look covered.
            missing=$(for f in src/lib/*.ts; do case $f in *.test.ts) ;; *) grep -qx "SF:$f" lcov-ts.info || echo "$f";; esac; done)
            if [ -n "$missing" ]; then printf 'Not imported by any unit test (0%%): %s\n\n' "$(echo $missing)"; fi
            echo 'Svelte components (`src/routes`, `src/lib/*.svelte`) are covered by e2e only.'
          } >> "$GITHUB_STEP_SUMMARY"
      # Default features only (the test job builds embedded-ai) to keep the instrumented build short.
      - if: steps.gate.outputs.run == 'true'
        name: Rust coverage
        working-directory: src-tauri
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov report --lcov --output-path ../lcov-rust.info
          cargo llvm-cov report | tee ../rust.txt
          { echo '## Rust coverage (`cargo test`)'; echo '```'; cat ../rust.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov-*.info
      # Last, so the artifact is uploaded even when coverage dropped.
      - if: steps.gate.outputs.run == 'true'
        name: Coverage ratchet
        run: |
          set -o pipefail
          { echo '## Coverage ratchet (`coverage-baseline.json`)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          npm run --silent coverage:ratchet | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit ${failed:-0}
