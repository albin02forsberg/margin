name: Release

# Push a tag like v0.2.0 to build installers for Linux, macOS and Windows
# and attach them to a draft GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Release notes since the previous stable tag (#254), made once on Linux so every matrix leg sends the
  # same body. HEAD^ also covers runs without a tag: the notes then reach back to the latest stable tag.
  notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.n.outputs.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: n
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          { echo 'body<<EOF_NOTES'; bash .github/scripts/changelog.sh "$prev" HEAD; echo EOF_NOTES; } >> "$GITHUB_OUTPUT"

  build:
    needs: notes
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--features embedded-ai'
          - platform: macos-latest
            args: '--target universal-apple-darwin --features embedded-ai'
          - platform: windows-latest
            args: '--features embedded-ai'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxss-dev patchelf
      # Built-in AI (llama.cpp, #132) needs cmake, a C++ compiler and libclang: all on the runners.
      # On x86_64 it uses AVX2 (ai.rs refuses CPUs without it); llama.cpp's default is SSE only.
      - name: llama.cpp CPU features
        if: matrix.platform != 'macos-latest'
        shell: bash
        run: printf 'GGML_AVX=ON\nGGML_AVX2=ON\nGGML_FMA=ON\nGGML_F16C=ON\nGGML_BMI2=ON\n' >> "$GITHUB_ENV"
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the public half is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Margin ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          # Also becomes `notes` in latest.json.
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          args: ${{ matrix.args }}
