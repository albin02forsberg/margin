[package]
name = "margin"
version = "0.1.0"
description = "Notes, tasks, journal and time tracking in plain org files"
authors = ["Albin Forsberg"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "margin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
toml = "1.1.6"
walkdir = "2.5.0"
percent-encoding = "2"
regex = "1.13.1"
notify-debouncer-mini = "0.7.0"
base64 = "0.22"
tauri-plugin-process = "2"
# Model downloads (#132); all three already come with tauri-plugin-updater.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
# Runs built-in models inside Margin (#132); needs cmake and a C++ compiler, so it is opt-in.
llama-cpp-2 = { version = "0.1.158", default-features = false, optional = true }

[features]
embedded-ai = ["dep:llama-cpp-2"]


# Line tables only: smaller debug builds link faster (e2e CI builds a debug binary).
[profile.dev]
debug = "line-tables-only"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
user-idle = "0.6"
